# Light status theme. Same options as theme01.conf, colors from alacritty/light_mode.toml.

background="#fafafa"
foreground="#383a42"
accent="#0184bc"
accent_bright="#0997b3"
green="#50a14f"
green_bright="#50a14f"
red="#e45649"
on_accent="#fafafa"
border="#c8c8c8"
message_bg="#e8e8e8"

set-option -g mode-keys vi

set-option -g status-style "bg=$background,fg=$foreground"
set-option -g status-position bottom
set-option -g status-justify left

set-window-option -g window-status-style "bg=$background,fg=$foreground"
set-window-option -g window-status-current-style "bg=$accent,fg=$on_accent,bold"
set-window-option -g window-status-separator " "

set-window-option -g window-status-format " #I: #W "
set-window-option -g window-status-current-format " #I: #W "

set-option -g pane-border-style "fg=$border"
set-option -g pane-active-border-style "fg=$accent_bright"

set-option -g message-style "bg=$message_bg,fg=$foreground"
set-option -g message-command-style "bg=$message_bg,fg=$foreground"
set-option -g prompt-cursor-colour "$foreground"

set-window-option -g copy-mode-match-style "bg=$green,fg=$on_accent"
set-window-option -g copy-mode-current-match-style "bg=$green_bright,fg=$on_accent"
